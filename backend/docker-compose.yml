version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dynapharm-postgres
    environment:
      POSTGRES_DB: dynapharm
      POSTGRES_USER: dynapharm
      POSTGRES_PASSWORD: dynapharm_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dynapharm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

